---
stages:
  - "lint"
  - "test"

include:
  # Consumers include the same file from a tag — see the header of that file.
  - local: "/ci/object-storage.gitlab-ci.yml"

variables:
  # Used by GitLab to initialise the postgres service container (example-test)
  POSTGRES_DB: cosmo_ecosystem
  POSTGRES_USER: cosmo_ecosystem_user
  POSTGRES_PASSWORD: test
  POSTGRES_HOST_AUTH_METHOD: trust
  # Credentials for the object storage service (ci/object-storage.gitlab-ci.yml)
  OBJECT_STORAGE_ACCESS_KEY: "accesskey"
  OBJECT_STORAGE_SECRET_KEY: "secretkey"

# =========================================================================
# Framework (root package: cosmo_ecosystem/)
# =========================================================================

framework-lint:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run ruff format --check cosmo_ecosystem test"
    - "uv run ruff check cosmo_ecosystem test"
    # uv.lock records the project version too, but it is derived, not a place to
    # maintain by hand — this fails if it is out of step with pyproject.toml.
    # The four hand-maintained version places are checked by test_version.py.
    - "uv lock --check"

# Gate: the framework package must stay domain-free (no CSV-profiler references).
# The check lives in ci/check-domain-free.sh, shared with the pre-commit hook.
domain-free:
  stage: "lint"
  image: "python:3.13"
  script:
    - "bash ci/check-domain-free.sh"

# Framework-scope tests (static id enforcement, etc.) — no services needed.
framework-test:
  stage: "test"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "uv sync"
  script:
    - "uv run pytest test/ -v"

# =========================================================================
# Example app (examples/csv_profiler/) — consumes the framework
# =========================================================================

example-lint:
  stage: "lint"
  image: "python:3.13"
  before_script:
    - "pip install uv"
    - "cd examples/csv_profiler"
    - "uv sync"
  script:
    - "uv run ruff format --check ."
    - "uv run ruff check ."
    - "uv lock --check"

example-test:
  stage: "test"
  image: "python:3.13"
  services:
    - name: "postgres:17"
      alias: postgres
    - !reference [.cosmo-ecosystem-object-storage, services]
    - name: "redis:7-alpine"
      alias: redis
  before_script:
    - apt-get update && apt-get install -y postgresql-client curl rclone
    - !reference [.cosmo-ecosystem-object-storage, before_script]
    - cd examples/csv_profiler
    - "cp env_ci .env"
    - "source .env"
    # No rclone setup here: conftest runs setup_remote() and create_bucket().
    - "export PGPASSWORD=${POSTGRES_PASSWORD}"
    - "psql -h ${POSTGRES_HOST_NAME} -U ${POSTGRES_USER} -d ${POSTGRES_DB} < docker/init.sql"
    - "pip install uv"
    - "uv sync"
    - "uv run playwright install --with-deps chromium"
    - "mkdir -p test/artifacts"
  script:
    - uv run pytest -v --screenshot only-on-failure --tracing retain-on-failure --output test/artifacts
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - examples/csv_profiler/test/artifacts/
