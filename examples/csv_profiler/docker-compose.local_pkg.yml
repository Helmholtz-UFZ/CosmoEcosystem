# docker-compose.local_pkg.yml
#
# SKELETON — This file is a non-functional example of the local package
# override pattern. It demonstrates how to mount a local Python package
# into both web and worker containers for development.
#
# This is the same pattern used by:
#   - COSMOPOLITAN: docker-compose.local-smp.yml (soil-moisture-prediction)
#   - COSMONAUT: docker-compose.local-sr.yml (sensor-routing)
#
# Prerequisites:
#   1. Extract your computation module into a separate pip-installable package
#      (its own git repo with pyproject.toml)
#   2. Add it as a dependency in this project's pyproject.toml
#   3. Update the paths below to point to your local package checkout
#   4. Remove the error guard in dev_up.sh for --local-computation-module
#   5. Wire dev_up.sh to include this file:
#      COMPOSE="docker compose -f docker-compose.yml -f docker-compose.local_pkg.yml"
#
# Usage (once configured):
#   ./dev_up.sh --local-computation-module
#
# See README.md "Extracting your computation module" for full instructions.

services:
  cosmo-ecosystem:
    volumes:
      # Mount your local package source into the container's site-packages.
      # Replace <your_package_name> and the host path with your actual values.
      #
      # Example: if your package is at ../my-computation-pkg/src/my_computation/
      # - "../my-computation-pkg/src/my_computation:/python_docker/cosmo_ecosystem/.venv/lib/python3.13/site-packages/my_computation"
      - "../YOUR_PACKAGE_REPO/src/YOUR_PACKAGE_NAME:/python_docker/cosmo_ecosystem/.venv/lib/python3.13/site-packages/YOUR_PACKAGE_NAME"

  cosmo-ecosystem-worker:
    volumes:
      # Same mount for the worker container so both use the same local code.
      - "../YOUR_PACKAGE_REPO/src/YOUR_PACKAGE_NAME:/python_docker/cosmo_ecosystem/.venv/lib/python3.13/site-packages/YOUR_PACKAGE_NAME"
