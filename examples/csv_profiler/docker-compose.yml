# Host-published ports are parameterised as ${…_HOST_PORT:-<today's value>} so that
# the three sister stacks (cosmopolitan, cosmonaut, csv_profiler) can run side by side
# on one machine — see cosmo-ecosystem/docs/plan/local-port-allocation.md for the
# allocation. With none of these variables set the resolved mappings are identical to
# before, so CI and production are untouched.
# Note the asymmetry: the left side is the *host* port, the right side stays fixed,
# because that is what the service listens on inside the compose network. The
# app-facing POSTGRES_PORT / REDIS_PORT / OBJECT_STORAGE_HOST answer a different
# question ("where does the app connect to") and must not be reused here.
# FLASK_PORT is the exception: it keeps its double role (the port the app binds inside
# the container *and* the port the Dash test server binds outside Docker), so the
# webserver mapping falls back to FLASK_PORT rather than to a literal. A literal
# default would publish 8080 for anyone who sets only FLASK_PORT — a mismatch that
# looks like the app not starting.
services:
  cosmo-ecosystem:
    image: cosmo-ecosystem-webserver
    container_name: cosmo-ecosystem-webserver
    build:
      # Repo root: the example depends on cosmo-ecosystem by local path, so the
      # framework source must be in the build context.
      context: ../..
      dockerfile: examples/csv_profiler/docker/dev.Dockerfile
      network: host
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    ports:
      - "${FLASK_HOST_PORT:-${FLASK_PORT}}:${FLASK_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount the whole repo (framework + example live) for reload; the anonymous
      # volume preserves the image-built venv over the bind mount.
      - "../..:/python_docker/cosmo_ecosystem"
      - "/python_docker/cosmo_ecosystem/examples/csv_profiler/.venv"

  cosmo-ecosystem-worker:
    image: cosmo-ecosystem-worker
    container_name: cosmo-ecosystem-worker
    build:
      context: ../..
      dockerfile: examples/csv_profiler/docker/worker.Dockerfile
      network: host
    env_file: .env
    environment:
      TZ: Europe/Berlin
    user: "${DOCKER_UID}:${DOCKER_GID}"
    depends_on:
      postgres:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      # Mount the whole repo (framework + example live) for reload; the anonymous
      # volume preserves the image-built venv over the bind mount.
      - "../..:/python_docker/cosmo_ecosystem"
      - "/python_docker/cosmo_ecosystem/examples/csv_profiler/.venv"

  redis:
    image: redis:7-alpine
    container_name: redis_cosmo_ecosystem
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    container_name: postgres_cosmo_ecosystem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  # S3 server for local runs. Same image as CI (ci/object-storage.gitlab-ci.yml),
  # and the block every app copies: docs/conventions/object_storage.md.
  object-storage:
    image: rustfs/rustfs:1.0.0
    container_name: object_storage_cosmo_ecosystem
    ports:
      - "${OBJECT_STORAGE_HOST_PORT:-9000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_HOST_PORT:-9001}:9001" # Web console at /rustfs/console/
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health/ready"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  redis_data:
