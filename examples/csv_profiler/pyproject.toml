[project]
name = "csv-profiler"
version = "0.1.0"
description = "CSV statistical profiler — reference domain / example app for the Cosmo Ecosystem"
readme = "README.md"
license = { text = "EUPL-1.2" }
requires-python = ">=3.13"
dependencies = [
    "cosmo-ecosystem",
    "dash-form-factory==0.1.9",
    "pandas>=2.0.0,<3",
    "numpy>=1.26.0,<3",
]

# In this monorepo the framework is resolved from the local path (editable) so the
# example runs against the working tree. A real downstream app would instead pin a
# git tag, e.g.:
#   [project.dependencies] "cosmo-ecosystem @ git+https://codebase.helmholtz.cloud/.../cosmo-ecosystem@v0.10.0"
# See the README (--local-core dev loop + tagged-release note).
[tool.uv.sources]
cosmo-ecosystem = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "pytest-playwright>=0.6.2",
    "python-slugify>=8.0.0",
    "selenium>=4.0.0",
    "ruff>=0.7.4",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["csv_profiler"]
