# The S3 server every Cosmo Ecosystem test job runs against. The one place that knows
# which server it is: the image pin, its credential variables and its health path.
# Production does not use it — prod and stage talk to UFZ S3.
#
# A consumer includes this file at the tag it pins in pyproject.toml and splices
# both halves into its test job with !reference. `extends:` does not work here: it
# replaces the job's own services and before_script lists instead of adding to them.
#
#   include:
#     - project: "ufz/tb5-smm/met/wg7/cosmo-ecosystem"
#       ref: "vX.Y.Z"  # the tag of the cosmo-ecosystem pin in pyproject.toml
#       file: "/ci/object-storage.gitlab-ci.yml"
#
#   test:
#     services:
#       - !reference [.cosmo-ecosystem-object-storage, services]
#       - ...
#     before_script:
#       - !reference [.cosmo-ecosystem-object-storage, before_script]
#       - ...
#
# The job needs OBJECT_STORAGE_ACCESS_KEY / OBJECT_STORAGE_SECRET_KEY as CI
# variables, and its env file OBJECT_STORAGE_HOST="http://object-storage:9000".
# See docs/conventions/object_storage.md.

.cosmo-ecosystem-object-storage:
  services:
    - name: "rustfs/rustfs:1.0.0"
      alias: "object-storage"
      variables:
        RUSTFS_ACCESS_KEY: "${OBJECT_STORAGE_ACCESS_KEY}"
        RUSTFS_SECRET_KEY: "${OBJECT_STORAGE_SECRET_KEY}"
        # The image also exposes the console port, which nothing in CI uses. The
        # runner's service check would otherwise wait on it too.
        HEALTHCHECK_TCP_PORT: "9000"
  before_script:
    # Bounded, so a server that never comes up fails the job here and says so,
    # instead of surfacing later as an rclone error inside the test session.
    - >-
      timeout 60 sh -c 'until curl -sf http://object-storage:9000/health/ready > /dev/null;
      do echo "Waiting for object storage..."; sleep 1; done'
