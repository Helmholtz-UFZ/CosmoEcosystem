# Mirrors the framework-lint and example-lint jobs in .gitlab-ci.yml.
# The ruff hooks run from the project venvs so the version matches CI (uv.lock).
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: end-of-file-fixer
      files: '\.py$'
    - id: trailing-whitespace
      files: '\.py$'
- repo: local
  hooks:
    - id: framework-ruff-format
      name: framework ruff format --check
      entry: uv run ruff format --check cosmo_ecosystem test
      language: system
      pass_filenames: false
      types_or: [python, pyi]
      files: '^(cosmo_ecosystem|test)/'
    - id: framework-ruff
      name: framework ruff check
      entry: uv run ruff check cosmo_ecosystem test
      language: system
      pass_filenames: false
      types_or: [python, pyi]
      files: '^(cosmo_ecosystem|test)/'
    - id: framework-uv-lock
      name: framework uv lock --check
      entry: uv lock --check
      language: system
      pass_filenames: false
      files: '^(pyproject\.toml|uv\.lock)$'
    - id: example-ruff-format
      name: example ruff format --check
      entry: bash -c 'cd examples/csv_profiler && uv run ruff format --check .'
      language: system
      pass_filenames: false
      types_or: [python, pyi]
      files: '^examples/csv_profiler/'
    - id: example-ruff
      name: example ruff check
      entry: bash -c 'cd examples/csv_profiler && uv run ruff check .'
      language: system
      pass_filenames: false
      types_or: [python, pyi]
      files: '^examples/csv_profiler/'
    - id: example-uv-lock
      name: example uv lock --check
      entry: bash -c 'cd examples/csv_profiler && uv lock --check'
      language: system
      pass_filenames: false
      files: '^examples/csv_profiler/(pyproject\.toml|uv\.lock)$'
